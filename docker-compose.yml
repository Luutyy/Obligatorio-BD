
services:
  db:
    image: mysql:8.0
    container_name: torneo_db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
    ports:
      - "3307:3306"
    volumes:
      - datos_mysql:/var/lib/mysql
      - ./Scripts:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -p$${MYSQL_ROOT_PASSWORD}"]
      interval: 5s
      timeout: 5s
      retries: 20

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: torneo_backend
    restart: always
    ports:
      - "8000:8000"
    environment:
      DB_HOST: db
      DB_PORT: 3306
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      DB_ADMIN_USER: ${DB_ADMIN_USER}
      DB_ADMIN_PASSWORD: ${DB_ADMIN_PASSWORD}
      DB_PLANILLERO_USER: ${DB_PLANILLERO_USER}
      DB_PLANILLERO_PASSWORD: ${DB_PLANILLERO_PASSWORD}
      DB_LECTOR_USER: ${DB_LECTOR_USER}
      DB_LECTOR_PASSWORD: ${DB_LECTOR_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    container_name: torneo_frontend
    restart: always
    ports:
      - "3000:3000"
    environment:
      HOST: 0.0.0.0
      REACT_APP_API_URL: http://localhost:8000
    depends_on:
      - backend

volumes:
  datos_mysql:
